<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P4Prime - 设置</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div class="top-bar">
        <h1>P4Prime - 设置</h1>

        <!-- 导航菜单 -->
        <div class="nav-menu">
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> 主页</a></li>
                <li class="has-submenu">
                    <a href="#"><i class="fas fa-network-wired"></i> 拓扑</a>
                    <ul class="sub-menu">
                        <li><a href="#">FatTree4</a></li>
                        <li><a href="/topology/fattree6">FatTree6</a></li>
                        <li><a href="#">新增拓扑</a></li>
                    </ul>
                </li>
                <li><a href="/settings"><i class="fas fa-cog"></i> 设置</a></li>
            </ul>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="header">
            <h1>系统设置</h1>
        </div>
        <div class="section">
            <h2>网络配置</h2>
            <p>在此处调整 P4Prime 的网络参数。</p>
            <div class="sub-section" style="margin-top: 20px;">
                <h3 style="color: #006064;">主机节点配置</h3>
            
                <!-- 主机形状 -->
                <label for="hostShape">主机形状：</label>
                <select id="hostShape">
                    <option value="dot">圆形 (dot)</option>
                    <option value="box">方形 (box)</option>
                    <option value="ellipse" selected>椭圆形 (ellipse)</option>
                    <option value="triangle">三角形 (triangle)</option>
                    <option value="star">星形 (star)</option>
                    <option value="hexagon">六边形 (hexagon)</option>
                </select>
            
                <!-- 主机颜色 -->
                <label for="hostColor" style="margin-top:10px;">主机颜色：</label>
                <input type="color" id="hostColor" value="#FFD700">
            
                <!-- 主机大小 -->
                <label for="hostSize" style="margin-top:10px;">主机大小：</label>
                <input type="range" id="hostSize" min="10" max="80" value="25">
                <span id="hostSizeValue">25</span>
            </div>
            
            <div class="sub-section" style="margin-top: 20px;">
                <h3 style="color: #006064;">交换机节点配置</h3>
            
                <!-- 交换机形状 -->
                <label for="switchShape">交换机形状：</label>
                <select id="switchShape">
                    <option value="dot">圆形 (dot)</option>
                    <option value="box" selected>方形 (box)</option>
                    <option value="ellipse">椭圆形 (ellipse)</option>
                    <option value="triangle">三角形 (triangle)</option>
                    <option value="star">星形 (star)</option>
                    <option value="hexagon">六边形 (hexagon)</option>
                </select>
            
                <!-- 交换机颜色 -->
                <label for="switchColor" style="margin-top:10px;">交换机颜色：</label>
                <input type="color" id="switchColor" value="#87CEEB">
            
                <!-- 交换机大小 -->
                <label for="switchSize" style="margin-top:10px;">交换机大小：</label>
                <input type="range" id="switchSize" min="10" max="80" value="25">
                <span id="switchSizeValue">25</span>
            </div>
            
            <button id="saveSettingsBtn" style="margin-top: 15px;">保存设置</button>
            <div id="saveStatus" style="margin-top: 8px; color: green;"></div>
            
        </div>
    </div>

    <!-- 外部 JS -->
    <script src="../static/main.js"></script>
    <script src="../static/settings.js"></script>
</body>

</html>
